services:
  postgres:
    image: postgres:16-alpine
    container_name: taskboard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskboard_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskboard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskboard_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/taskboard_db?schema=public"
      JWT_SECRET: "super-secret-jwt-key-taskboard-university-2026"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "*"

volumes:
  postgres_data:
